name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 开源边界检查
        run: python3 tool/check_public_source.py

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 开源边界检查（构建前）
        run: python3 tool/check_public_source.py
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Zhijian.xcodeproj \
            -scheme Zhijian \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
